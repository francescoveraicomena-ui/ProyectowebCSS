<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<!-- FAVICON Y/O LOGOTIPO DE LA PAGINA -->
<link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">

<!-- LIBRERIA DE FUENTES -->
<link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">

<!-- FRAMEWORK DE BOOTSTRAP -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

<!-- LIBRERIA DE ICONOS -->
<script src="https://kit.fontawesome.com/812c8ee19a.js" crossorigin="anonymous"></script>
<!-- hoja de estilos -->
<link rel="stylesheet" href="css/login2.css">
>
<script src="js/WE_MC_03_jquery.js"></script>

<body>

    <div class="login-container">
        <div class="image-section">
            <img src="img/Captura de pantalla 2026-10-28 073927.png" alt="Plaza Huancayo">
        </div>

        <div class="form-section">
            <form class="login-form">

                <div class="logo-box">
                    <img src="img/logoRed.svg" alt="Caja Huancayo">
                </div>

                <h2>Bienvenido Colaborador</h2>
                <p class="subtitle">Ingrese sus credenciales</p>

                <div class="input-group">
                    <input type="text" placeholder="Usuario" required>
                    <i class="fa-solid fa-user icon"></i>
                </div>

                <div class="input-group">
                    <input type="password" placeholder="Contraseña" required>
                    <i class="fa-solid fa-eye-slash icon"></i>
                </div>

                <div class="options-group">
                    <label class="switch-label">
                        <input type="checkbox">
                        <span class="slider"></span>
                        Recordar usuario
                    </label>
                    <a href="#">¿Olvidó sus credenciales?</a>
                </div>

                <div class="captcha-box">
                    <input type="checkbox" id="captcha">
                    <label for="captcha">No soy un robot</label>
                </div>

                <button type="submit" class="btn-submit">Ingresar</button>

            </form>
        </div>

    </div>

</body>

</html>
